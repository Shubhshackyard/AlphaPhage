version: '3.8'

services:
  ingestion:
    build:
      context: ../ingestion
      dockerfile: Dockerfile
    environment:
      - TWITTER_API_KEY=${TWITTER_API_KEY}
      - TWITTER_API_SECRET=${TWITTER_API_SECRET}
      - KAFKA_BROKER=${KAFKA_BROKER}
    depends_on:
      - kafka

  processing:
    build:
      context: ../processing
      dockerfile: Dockerfile
    environment:
      - KAFKA_BROKER=${KAFKA_BROKER}
      - DELTA_LAKE_PATH=${DELTA_LAKE_PATH}
    depends_on:
      - kafka

  nlp_service:
    build:
      context: ../nlp_service
      dockerfile: Dockerfile
    environment:
      - MODEL_PATH=${MODEL_PATH}
    depends_on:
      - processing

  anomaly_detector:
    build:
      context: ../anomaly_detector
      dockerfile: Dockerfile
    environment:
      - DELTA_LAKE_PATH=${DELTA_LAKE_PATH}
    depends_on:
      - processing

  api:
    build:
      context: ../api
      dockerfile: Dockerfile
    environment:
      - ALERTS_DB_PATH=${ALERTS_DB_PATH}
    depends_on:
      - anomaly_detector

  dashboard:
    build:
      context: ../dashboard
      dockerfile: Dockerfile

  kafka:
    image: wurstmeister/kafka:latest
    environment:
      KAFKA_ADVERTISED_LISTENERS: INSIDE://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INSIDE:PLAINTEXT
      KAFKA_LISTENERS: INSIDE://0.0.0.0:9092
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
    ports:
      - "9092:9092"
    depends_on:
      - zookeeper

  zookeeper:
    image: wurstmeister/zookeeper:latest
    ports:
      - "2181:2181"