apiVersion: apps/v1
kind: Deployment
metadata:
  name: alphaphage-dashboard
  labels:
    app: alphaphage-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alphaphage-dashboard
  template:
    metadata:
      labels:
        app: alphaphage-dashboard
    spec:
      containers:
      - name: dashboard
        image: alphaphage/dashboard:latest
        ports:
        - containerPort: 80
        env:
        - name: REACT_APP_API_URL
          value: "http://alphaphage-api:8000"
        resources:
          requests:
            memory: "256Mi"
            cpu: "0.1"
          limits:
            memory: "512Mi"
            cpu: "0.2"
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: alphaphage-dashboard
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
  selector:
    app: alphaphage-dashboard
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: alphaphage-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: alphaphage-dashboard
            port:
              number: 80
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: alphaphage-api
            port:
              number: 8000