apiVersion: apps/v1
kind: Deployment
metadata:
  name: nlp-service
  labels:
    app: nlp-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nlp-service
  template:
    metadata:
      labels:
        app: nlp-service
    spec:
      containers:
      - name: nlp-service
        image: alphaphage/nlp-service:latest
        ports:
        - containerPort: 8000
        env:
        - name: MODEL_PATH
          value: "/data/models"
        - name: MODEL_NAME
          value: "distilbert-base-nli-stsb-mean-tokens"
        - name: LOG_LEVEL
          value: "INFO"
        - name: EMBEDDING_DIMENSION
          value: "768"
        - name: TOPIC_THRESHOLD
          value: "10"
        volumeMounts:
        - name: model-storage
          mountPath: /data/models
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 10
        resources:
          requests:
            memory: "2Gi"
            cpu: "1"
          limits:
            memory: "4Gi"
            cpu: "2"
      volumes:
      - name: model-storage
        persistentVolumeClaim:
          claimName: model-storage-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: model-storage-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: nlp-service
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
  selector:
    app: nlp-service